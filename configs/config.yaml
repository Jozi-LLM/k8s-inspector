# configs/config-full.yaml
inspector:
  schedule: "0 */6 * * *"  # 每6小时执行一次

  clusters:
    - name: "production"
      kubeconfig: "$HOME/.kube/config"
      context: ""
  
  checks:
    enabled:
      - cluster_info
      - node_health
      - pod_health
      - resource_usage
      - deployment_health
      - service_health
    
    thresholds:
      cpu_usage_warning: 80
      memory_usage_warning: 85
      pod_restart_warning: 5
      disk_usage_warning: 90
      node_cpu_allocation_warning: 80
      node_memory_allocation_warning: 85
    
    settings:
      check_timeout: "30s"
      concurrent_checks: 5
  
  reporting:
    formats:
      - console
      - json
      - html
    output_dir: "./reports"
    retention_days: 30

logging:
  level: "info"
  format: "json"
  output: "both"
  file: "./logs/k8s-inspector.log"

alerting:
  slack:
    enabled: true
    webhook: "https://hooks.slack.com/services/..."
    channel: "#k8s-alerts"
  webhook:
    enabled: false
    url: "http://alert-manager/webhook"
    headers:
      X-Auth-Token: "your-token"
  email:
    enabled: false
    smtp_server: "smtp.example.com:587"
    username: "alert@example.com"
    password: "password"
    recipients:
      - "admin@example.com"
      - "ops@example.com"

storage:
  enabled: true
  driver: "sqlite"
  dsn: "./data/k8s-inspector.db"
  max_conns: 10
  cleanup_days: 90

server:
  enabled: true
  port: 8080
  host: "0.0.0.0"
  auth:
    enabled: false
    username: "admin"
    password: "password"